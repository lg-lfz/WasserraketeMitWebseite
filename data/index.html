<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>🚀 Rocket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topnav">
      <h1>🚀 Rocket - %MAC%</h1>
    </div>
    <div class="content">
      <div class="card">
        <h2 class="pressure">Pressure: <span id="pressure">0.0</span> hPa</h2>
        <h2 class="altitude">Altitude: <span id="altitude">0.0</span> m</h2>
        <h2 class="temperature">Temperature: <span id="temperature">0.0</span> &deg;C</h2>
        <h2 class="realData">BMP-Sensor: <span id="realData">-</span></h2>
        <h2 class="clients">Clients: <span id="clients">0</span></h2>
        <p class="state" id="stateContainer">State: <span id="state">not recording...</span></p>
        <p><button id="Startbutton" class="button">Start</button></p>
        <div class="footer">
          <span class="rocket">🚀</span>
          <img class="qrcode" src="./10-10-10-10-qr-code.svg" alt="QR-Code">
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
